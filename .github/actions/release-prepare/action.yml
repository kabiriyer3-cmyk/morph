name: Prepare release
description: Creates a fresh draft release for the version in src-tauri/tauri.conf.json
outputs:
  release_id:
    description: Draft release id
    value: ${{ steps.r.outputs.release_id }}
  tag:
    description: Release tag
    value: ${{ steps.r.outputs.tag }}
  version:
    description: App version
    value: ${{ steps.r.outputs.version }}
runs:
  using: composite
  steps:
    - id: r
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
        TAG="v$VERSION"
        PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select((.draft | not) and .tag_name == \"$TAG\") | .id")
        if [ -n "$PUBLISHED" ]; then
          echo "::error::Release $TAG is already published. Bump \"version\" in src-tauri/tauri.conf.json."
          exit 1
        fi
        for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
        done
        sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
        ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Morph $TAG" -F draft=true -F prerelease=false -F body=@"$RUNNER_TEMP/notes.md" -q .id)
        echo "release_id=$ID" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
