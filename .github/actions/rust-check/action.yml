name: Rust check
description: cargo check with every compiler error collected into one annotation
runs:
  using: composite
  steps:
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: cargo check
      shell: bash
      working-directory: src-tauri
      run: |
        set +e
        cargo check --message-format=json > ../cargo.json 2> ../cargo.err
        code=$?
        node ../scripts/annotate-cargo.mjs ../cargo.json ../cargo.err $code
        exit $code
