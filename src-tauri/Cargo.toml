[package]
name = "morph"
version = "0.3.0"
description = "Node-based multitool for your files"
authors = ["Morph contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = "0.45"
png = "0.17"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = "0.25"
webp = "0.3"
oxipng = { version = "9", default-features = false, features = ["parallel", "zopfli"] }
png = "0.17"
color_quant = "1"
resvg = "0.45"
gltf = "1"
# zip 2.6 changed ZipFile generics (breaks calamine 0.26), keep the 2.2..2.4 line
zip = { version = ">=2.2, <2.5", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
xz2 = { version = "0.1", features = ["static"] }
bzip2 = "0.4"
sevenz-rust2 = "0.25"
encoding_rs = "0.8"
chardetng = "0.1"
serde_yaml = "0.9"
toml = "0.8"
csv = "1"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake3 = "1"
crc32fast = "1"
walkdir = "2"
rayon = "1"
regex = "1"
chrono = "0.4"
# spreadsheets
calamine = "0.26"
rust_xlsxwriter = "0.79"
# PDF tools
lopdf = "0.32"
# QR codes, Markdown, EXIF
qrcode = { version = "0.14", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
kamadak-exif = "0.5"
# one-click tool downloads (rustls, no OpenSSL)
ureq = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
